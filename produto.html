<!------------------------------------------------ Conteúdo do Produto (dinâmico) ------------------------------------------------>

<div class="produto">
    <div class="card-celular" id="imagens-container">
        <!-- as <img> são inseridas aqui pelo produto.js -->
    </div>

    <div class="produto-info">
        <div class="alinha-texto">
            <h1 id="produto-nome"></h1>
            <h2 id="produto-specs"></h2>
        </div>

        <div class="produto-info">

            <!-- Coluna de compra: preço, opções e botões, agrupados num
                 wrapper próprio. Isso separa fisicamente esse bloco do
                 "Sobre o produto" no DOM, permitindo usar flexbox com
                 colunas de altura independente (sem o problema de linhas
                 de grid compartilhadas inflando o espaçamento). -->
            <div class="coluna-compra">

                <h2 class="price">R$ <span id="preco"></span></h2>

                <div class="opcao-bloco">
                    <span class="opcao-titulo">Armazenamento</span>
                    <div class="storage-options" id="storage-options">
                        <!-- botões de armazenamento inseridos pelo produto.js -->
                    </div>
                </div>

                <div class="opcao-bloco">
                    <span class="opcao-titulo">Memória RAM</span>
                    <div class="storage-options" id="ram-options">
                        <!-- botões de RAM inseridos pelo produto.js -->
                    </div>
                </div>

                <div class="opcao-bloco" id="pulseira-bloco">
                    <span class="opcao-titulo">Tamanho da pulseira</span>
                    <div class="storage-options" id="pulseira-options">
                        <!-- botões de pulseira inseridos pelo produto.js -->
                    </div>
                </div>

                <div class="opcao-bloco" id="cor-bloco">
                    <span class="opcao-titulo">Cor</span>
                    <div class="cor-container">
                        <button class="cor-celular1"></button>
                        <button class="cor-celular2"></button>
                        <button class="cor-celular3"></button>
                    </div>
                </div>

                <div class="acoes-produto">
                    <a href="#" class="btn-comprar">
                        <button class="buy">
                            <ion-icon class="icon" name="card-outline"></ion-icon>
                            Comprar
                        </button>
                    </a>
                    <button class="carrinho" id="btn-adicionar-carrinho" type="button">
                        <ion-icon class="icon" name="cart-outline"></ion-icon>
                        Adicionar ao carrinho
                    </button>
                </div>

            </div>

            <div class="sobre-produto">
                <h1 class="titulo-explicativo">Sobre o produto</h1>
                <p class="texto-explicativo"></p>
            </div>
        </div>
    </div>
</div>

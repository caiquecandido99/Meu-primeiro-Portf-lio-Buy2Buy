    <link rel="alternate icon" type="image/png" href="./Assets/buy2buy-icone-32.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

<body>

<!--------------------------------------------------- Navbar ----------------------------------------------------------->
<nav class="navbar">
    <a href="./pagina-de-produtos.html" class="home-icon-navbar" aria-label="Página inicial">
        <ion-icon name="home-outline"></ion-icon>
    </a>

    <a href="./carrinho.html" class="cart-link cart-icon-navbar" aria-label="Carrinho">
        <ion-icon name="cart-outline"></ion-icon>
        <span class="cart-count">0</span>
    </a>

    <button class="menu-toggle" id="menuToggle" aria-label="Abrir menu">
        <span></span><span></span><span></span>
    </button>

    <a href="./index.html" class="logo-navbar">
        <img src="./Assets/buy2buy-icone.svg" alt="Logo da Buy2Buy" class="logo">
    </a>

    <ul class="menu-navbar" id="menuNavbar">
        <li><a class="font-navbar" href="./pagina-de-produtos.html" aria-label="Página inicial"><ion-icon name="home-outline"></ion-icon></a></li>
        <li class="dropdown">
            <a href="#" class="dropbtn" aria-label="Filtros">
                <span class="dropbtn-hamburguer"><span></span><span></span><span></span></span>
            </a>
            <ul class="submenu">
                <li><a href="./pagina-de-produtos.html?categoria=smartwatches" class="filtro-link"><ion-icon name="watch-outline"></ion-icon> Smartwatches</a></li>
                <li><a href="./pagina-de-produtos.html?categoria=smartphones" class="filtro-link"><ion-icon name="phone-portrait-outline"></ion-icon> Smartphones</a></li>
                <li><a href="./pagina-de-produtos.html?categoria=fone" class="filtro-link"><ion-icon name="headset-outline"></ion-icon> Fones Bluetooth</a></li>
            </ul>
        </li>
        <li class="cart-item-desktop">
            <a href="./carrinho.html" class="cart-link">
                <ion-icon name="cart-outline"></ion-icon>
                <span class="cart-count">0</span>
            </a>
        </li>
    </ul>
</nav>

<!------------------------------------------------ Conteúdo do Pagamento (dinâmico) ------------------------------------------------>

<div class="produto">
    <div class="card-celular">
        <img id="produto-imagem" src="" alt="" class="celular">
    </div>

    <div class="produto-info">

        <h2 id="produto-nome"></h2>
        <p id="produto-armazenamento" class="armazenamento-selecionado"></p>

        <h2 class="price">R$ <span id="preco"></span></h2>

        <div>
            <button onclick="mostrarQR()" class="btn-imagem">
                <img src="./Assets/pix.png" alt="pix logo" class="icone-btn">
                <span> Pix</span>
            </button>
            <img id="qrcode" src="qrcode.png" alt="QR Code" class="qrcode-escondido">

            <button onclick="mostrarPesquisa()" class="btn-imagem">
                <img src="./Assets/mastercard logo.png" alt="pix logo" class="icone-btn">
                <img src="./Assets/visa logo.png" alt="pix logo" class="icone-btn">
                <span>Crédito ou débito</span>
            </button>
        </div>

        <div id="campoDadosbancarios" class="input-topzera">
            <input type="tel" placeholder="Número do cartão" maxlength="16">
            <input type="text" placeholder="Nome do titular" autocapitalize="characters">
            <input type="tel" placeholder="Vencimento">
            <input type="tel" placeholder="Código de segurança" maxlength="3">
            <input type="tel" placeholder="Documento do titular" maxlength="11">
        </div>

        <div>
            <a href="#" id="link-finalizar" class="btn-comprar">
                <button class="btn-cor">Finalizar</button>
            </a>
        </div>

    </div>
</div>

<!---------------------------------------------------------- Rodapé ---------------------------------------------------------->
<footer class="footer">
    <div class="footer-content">
        <ul class="footer-links">
            <li><a href="#">Sobre</a></li>
            <li><a href="#">Contato</a></li>
            <li><a href="#">Privacidade</a></li>
        </ul>
    </div>
    <div>
        <img src="./Assets/buy2buy-icone.svg" alt="Logo da Buy2Buy no rodapé">
    </div>
    <div id="social-media">
        <a href="https://www.instagram.com/ocaiqueecandidoo/" target="_blank"><ion-icon name="logo-instagram"></ion-icon></a>
        <a href="https://www.linkedin.com/in/caique-candido-a59b031ba/" target="_blank"><ion-icon name="logo-linkedin"></ion-icon></a>
        <a href="https://github.com/caiquecandido99" target="_blank"><ion-icon name="logo-github"></ion-icon></a>
    </div>
</footer>

<script src="./cart.js"></script>
<script src="./buy.js"></script>
<script src="./filtro.js"></script>

</body>
</html>

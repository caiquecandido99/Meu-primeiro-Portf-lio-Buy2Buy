<svg viewBox="0 0 1200 320" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A0E1A"/>
      <stop offset="55%" stop-color="#111834"/>
      <stop offset="100%" stop-color="#151C3A"/>
    </linearGradient>

    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4A6DFF"/>
      <stop offset="100%" stop-color="#2C46C7"/>
    </linearGradient>

    <linearGradient id="phoneGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#6E8CFF"/>
      <stop offset="100%" stop-color="#3D5FE8"/>
    </linearGradient>

    <radialGradient id="glowSpot" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3D5FE8" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#3D5FE8" stop-opacity="0"/>
    </radialGradient>

    <mask id="fadeRight">
      <linearGradient id="fadeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" stop-color="#000000"/>
        <stop offset="35%" stop-color="#ffffff"/>
        <stop offset="100%" stop-color="#ffffff"/>
      </linearGradient>
      <rect x="0" y="0" width="1200" height="320" fill="url(#fadeGrad)"/>
    </mask>
  </defs>

  <!-- background -->
  <rect x="0" y="0" width="1200" height="320" fill="url(#bg)"/>

  <!-- ambient glow behind hero phone -->
  <circle cx="930" cy="160" r="230" fill="url(#glowSpot)"/>

  <!-- catalog grid watermark: repeating thin phone outlines, like the product cards -->
  <g mask="url(#fadeRight)" opacity="0.5">
    <g stroke="#4A6DFF" stroke-opacity="0.28" stroke-width="1.4" fill="none">
      <!-- row 1 -->
      <rect x="560" y="30" width="46" height="90" rx="8"/>
      <rect x="626" y="30" width="46" height="90" rx="8"/>
      <rect x="692" y="30" width="46" height="90" rx="8"/>
      <rect x="758" y="30" width="46" height="90" rx="8"/>
      <rect x="824" y="30" width="46" height="90" rx="8"/>
      <rect x="890" y="30" width="46" height="90" rx="8"/>
      <rect x="956" y="30" width="46" height="90" rx="8"/>
      <rect x="1022" y="30" width="46" height="90" rx="8"/>
      <rect x="1088" y="30" width="46" height="90" rx="8"/>
      <!-- row 2 -->
      <rect x="560" y="200" width="46" height="90" rx="8"/>
      <rect x="626" y="200" width="46" height="90" rx="8"/>
      <rect x="692" y="200" width="46" height="90" rx="8"/>
      <rect x="758" y="200" width="46" height="90" rx="8"/>
      <rect x="824" y="200" width="46" height="90" rx="8"/>
      <rect x="890" y="200" width="46" height="90" rx="8"/>
      <rect x="956" y="200" width="46" height="90" rx="8"/>
      <rect x="1022" y="200" width="46" height="90" rx="8"/>
      <rect x="1088" y="200" width="46" height="90" rx="8"/>
    </g>
  </g>

  <!-- signature element: one large featured phone, glowing, like the hero product card -->
  <g transform="translate(895,160)">
    <rect x="-58" y="-118" width="116" height="236" rx="20" fill="none" stroke="url(#phoneGlow)" stroke-width="3"/>
    <rect x="-46" y="-100" width="92" height="176" rx="6" fill="#0A0E1A" stroke="#2C3B6E" stroke-width="1"/>
    <circle cx="0" cy="-104" r="3" fill="#2C3B6E"/>
    <!-- screen reflection sweep -->
    <path d="M -46 -100 L -10 -100 L -46 40 Z" fill="#4A6DFF" opacity="0.14"/>
    <!-- camera cluster -->
    <circle cx="-24" cy="-82" r="9" fill="none" stroke="#4A6DFF" stroke-width="1.6"/>
    <circle cx="-24" cy="-60" r="9" fill="none" stroke="#4A6DFF" stroke-width="1.6"/>
    <circle cx="-24" cy="-38" r="9" fill="none" stroke="#4A6DFF" stroke-width="1.6"/>
    <!-- home indicator -->
    <rect x="-16" y="62" width="32" height="4" rx="2" fill="#2C3B6E"/>
  </g>

  <!-- frosted glass strip echoing the site navbar -->
  <rect x="0" y="266" width="1200" height="54" fill="#FFFFFF" opacity="0.035"/>
  <rect x="0" y="266" width="1200" height="1" fill="#FFFFFF" opacity="0.12"/>

  <!-- logo mark (blue tile, phone + padlock, matching the site's icon) -->
  <g transform="translate(60,96)">
    <rect x="0" y="0" width="64" height="64" rx="16" fill="url(#logoGrad)"/>
    <!-- phone outline -->
    <rect x="16" y="12" width="24" height="40" rx="5" fill="none" stroke="#FFFFFF" stroke-width="2.4"/>
    <line x1="24" y1="46" x2="32" y2="46" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round"/>
    <!-- padlock accent -->
    <g transform="translate(37,34)">
      <rect x="-9" y="0" width="18" height="14" rx="3" fill="#FF8A3D"/>
      <path d="M -6 0 v-5 a6 6 0 0 1 12 0 v5" fill="none" stroke="#FF8A3D" stroke-width="2.6"/>
    </g>
  </g>

  <!-- wordmark -->
  <text x="142" y="132" font-family="Arial, Helvetica, sans-serif" font-size="46" font-weight="800" letter-spacing="1" fill="#F5F7FA">BUY<tspan fill="#FF8A3D">2</tspan>BUY</text>

  <!-- tagline -->
  <text x="60" y="196" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#8B93A7">Catálogo e loja de smartphones — projeto front-end em desenvolvimento contínuo</text>

  <!-- small stack tags -->
  <g font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" letter-spacing="0.5">
    <rect x="60" y="222" width="66" height="28" rx="14" fill="#FFFFFF" fill-opacity="0.06" stroke="#FFFFFF" stroke-opacity="0.14"/>
    <text x="93" y="240" fill="#C7D0E8" text-anchor="middle">HTML</text>

    <rect x="136" y="222" width="60" height="28" rx="14" fill="#FFFFFF" fill-opacity="0.06" stroke="#FFFFFF" stroke-opacity="0.14"/>
    <text x="166" y="240" fill="#C7D0E8" text-anchor="middle">CSS</text>

    <rect x="206" y="222" width="90" height="28" rx="14" fill="#FFFFFF" fill-opacity="0.06" stroke="#FFFFFF" stroke-opacity="0.14"/>
    <text x="251" y="240" fill="#C7D0E8" text-anchor="middle">JAVASCRIPT</text>
  </g>
</svg>

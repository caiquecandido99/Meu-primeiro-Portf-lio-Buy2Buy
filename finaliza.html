    <ul class="menu-navbar" id="menuNavbar">
        <li><a class="font-navbar" href="./pagina-de-produtos.html" aria-label="Página inicial"><ion-icon name="home-outline"></ion-icon></a></li>
        <li class="dropdown">
            <a href="#" class="dropbtn" aria-label="Filtros">

            </a>

<!------------------------------------------------ Confirmação (dinâmico) ------------------------------------------------>

<div class="produto">
    <div class="card-celular">
        <img id="produto-imagem" src="" alt="" class="celular">
    </div>

    <div class="produto-info">

        <h2 id="produto-nome"></h2>
        <p id="produto-armazenamento" class="armazenamento-selecionado"></p>
        <h3>R$ <span id="preco"></span></h3>

        <div class="cor-icone">
            <ion-icon name="checkmark-done-circle-outline"></ion-icon>
            <h1>Compra realizada com sucesso</h1>
        </div>

        <div class="status-pedido">

            <div class="status-etapa concluida">
                <div class="status-icone">
                    <ion-icon name="receipt-outline"></ion-icon>
                </div>
                <span class="status-texto">Pedido realizado</span>
            </div>

            <div class="status-linha concluida"></div>

            <div class="status-etapa concluida">
                <div class="status-icone">
                    <ion-icon name="card-outline"></ion-icon>
                </div>
                <span class="status-texto">Pagamento aprovado</span>
            </div>

            <div class="status-linha"></div>

            <div class="status-etapa">
                <div class="status-icone">
                    <ion-icon name="cube-outline"></ion-icon>
                </div>
                <span class="status-texto">Pedido enviado</span>
            </div>

            <div class="status-linha"></div>

            <div class="status-etapa">
                <div class="status-icone">
                    <ion-icon name="home-outline"></ion-icon>
                </div>
                <span class="status-texto">Pedido entregue</span>
            </div>

        </div>

        <a href="./pagina-de-produtos.html" class="btn-comprar">
            <button class="btn-cor">
                <ion-icon class="icon" name="home-outline"></ion-icon>
                Voltar para a página inicial
            </button>
        </a>

    </div>
</div>

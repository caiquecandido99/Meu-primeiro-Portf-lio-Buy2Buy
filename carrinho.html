<!------------------------------------------------ Conteúdo do Carrinho ------------------------------------------------>

<div class="carrinho-pagina">
    <h1 class="titulo-carrinho">Meu Carrinho</h1>

    <div id="carrinho-container" class="carrinho-container">
        <!-- os cards de produto são inseridos aqui pelo carrinho.js -->
    </div>

    <p id="carrinho-vazio" class="carrinho-vazio">Seu carrinho está vazio.</p>

    <!-- Resumo: total da compra (soma de todos os itens do carrinho —
         celular, smartwatch, fone, ou qualquer combinação) + botão que
         leva pra página de pagamento. Escondido quando o carrinho está
         vazio, controlado pelo carrinho.js. -->
    <div id="carrinho-resumo" class="carrinho-resumo">
        <p class="carrinho-resumo-total">
            Total (<span id="carrinho-total-itens">0</span> itens):
            <span id="carrinho-total-valor">R$ 0,00</span>
        </p>
        <button id="btn-finalizar-compra" class="btn-finalizar-compra" type="button">
            Finalizar compra
        </button>
    </div>
</div>
